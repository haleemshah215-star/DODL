<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turbo Drift</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div class="label">Score</div>
        <div id="score">0</div>
        <div class="label">Best</div>
        <div id="best-score">0</div>
      </div>

      <canvas id="gameCanvas" width="360" height="640" aria-label="Car racing game"></canvas>

      <div id="overlay" class="overlay visible">
        <h1>Turbo Drift</h1>
        <p>Use arrow keys or A / D to dodge traffic</p>
        <button id="startBtn">Start Race</button>
      </div>

      <div class="controls">
        <button id="leftBtn" aria-label="Move left">◀</button>
        <button id="rightBtn" aria-label="Move right">▶</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
